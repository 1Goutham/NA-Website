<dialog class="modal" id="enquire" aria-labelledby="enquire-title">
  <form class="modal__inner" method="dialog" data-to="hello@nunnari.academy">
    <div class="modal__head">
      <div>
        <span class="eyebrow eyebrow--violet">Nunnari Academy</span>
        <h2 class="h4" id="enquire-title" style="font-size:1.5rem;margin-top:8px" data-dialog-title>Talk to our team</h2>
      </div>
      <button class="modal__close" type="button" aria-label="Close" data-close><svg class="i"><use href="#i-close"/></svg></button>
    </div>
    <input type="hidden" name="subject">
    <div class="field"><label for="f-name">Name</label><input id="f-name" name="name" autocomplete="name" required></div>
    <div class="field"><label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required></div>
    <div class="field"><label for="f-email">Email <span class="muted">(optional)</span></label><input id="f-email" name="email" type="email" autocomplete="email"></div>
    <div class="field"><label for="f-msg">Message <span class="muted">(optional)</span></label><textarea id="f-msg" name="message"></textarea></div>
    <button class="btn btn--primary btn--lg btn--block" type="submit">Send request <svg class="i i--arrow"><use href="#i-arrow"/></svg></button>
    <p class="modal__note"><svg class="i"><use href="#i-clock"/></svg> Our team will connect you within 24 – 48 hrs.</p>
  </form>
</dialog>
